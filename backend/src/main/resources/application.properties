spring.datasource.url=jdbc:mysql://localhost:3306/azhly
spring.datasource.username=azhly_user
spring.datasource.password=azhly_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

server.port=8081

# JWT Configuration
azhly.jwt.secret=${AZHLY_JWT_SECRET}
azhly.jwt.expiration=86400000